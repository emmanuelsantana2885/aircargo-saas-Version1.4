      - aircargo-uld
      - aircargo-load-planning
      - aircargo-audit-reports
      - aircargo-notification

  # ─────────────────────────────────────────────────────────────────
  # FRONTEND (Static Site) — CDN global + proxy /api/* → gateway
  # El cliente usa baseURL '/api' (frontend/src/api/client.js), por lo que el
  # Static Site reescribe /api/* hacia el gateway (render.com → onrender.com).
  # El orden de `routes` importa: primero el rewrite de /api, luego el SPA.
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: aircargo-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://aircargo-gateway.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    dependsOn:
      - aircargo-gateway
