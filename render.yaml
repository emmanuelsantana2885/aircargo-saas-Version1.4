# render.yaml — Blueprint 1-click para Aircargo SaaS
#
# Uso: Render Dashboard → New + → Blueprint → Connect repo → Apply.
#
# Qué crea este Blueprint:
#   - 1 PostgreSQL (aircargo-db, Render)          → top-level `databases:`
#   - 1 Key Value  (aircargo-cache, Render)       → `services:` type: keyvalue (opcional)
#   - 1 Environment Group (aircargo-secrets)      → JWT_SECRET + APP_ENCRYPTION_KEY
#   - 10 Web Services (Docker): auth + flight + booking + mawb + warehouse + uld
#     + load-planning + audit-reports + notification + gateway
#   - 1 Static Site (aircargo-frontend) con proxy rewrite /api/* → gateway
#
# ─── RabbitMQ (CloudAMQP free) — PASO MANUAL OBLIGATORIO ────────────────────
# Render NO ofrece RabbitMQ gestionado. Este Blueprint asume un broker EXTERNO
# (CloudAMQP plan "Little Lemur" gratis, https://cloudamqp.com).
#  1. Crea una instancia en CloudAMQP y copia su URL AMQP ("amqps://user:pass@host/vhost").
#  2. En Render → cada servicio que usa AMQP (auth, mawb, warehouse, uld,
#     booking, flight, load-planning, notification, audit-reports) → Environment
#     → rellena RABBITMQ_HOST / RABBITMQ_PORT / RABBITMQ_USER / RABBITMQ_PASSWORD
#     (los marcados con `sync: false`; Render los pide en el primer Apply).
#  3. CloudAMQP free usa amqps (TLS, puerto 5671). Añade RABBITMQ_SSL=true en
#     esos mismos servicios si tu broker exige TLS (ver propiedades abajo).
#  Nota: las variables RABBITMQ_* NO pueden vivir en un envVarGroup porque la
#  spec de Render prohíbe `sync: false` dentro de environment groups.
#
# ─── POSTGRES_HOST / POSTGRES_PORT — PASO MANUAL ────────────────────────────
# Render no expone host/port como propiedades de `fromDatabase`. Hay que
# rellenarlos una vez en cada servicio que usa BD, con los valores que Render
# muestra en el recurso aircargo-db (Internal Hostname / Port). Por eso van
# con `sync: false` a nivel de servicio (no en el env group).
#
# IMPORTANTE sobre el contexto de build: los Dockerfiles hacen `COPY backend/ .`,
# por lo que el contexto debe ser la RAÍZ del repo. NO uses `rootDir` en los
# servicios Docker (rompería el COPY). El `dockerfilePath` sí apunta al servicio.
#
# IMPORTANTE sobre HTTPS: Render expone cada Web Service con HTTPS
# (https://<name>.onrender.com) automáticamente. Las variables SERVICE_*_URL
# se llenan con esas URLs. Si algún día quieres un dominio propio, cámbialas.

# ─────────────────────────────────────────────────────────────────
# SECRETOS COMPARTIDOS (Environment Group)
# JWT_SECRET y APP_ENCRYPTION_KEY deben ser IDÉNTICOS en los 10 servicios.
# Render genera los valores una sola vez y los propaga por `fromGroup`.
# NOTA: no se admiten `sync: false` ni `fromDatabase` dentro de un envVarGroup.
# ─────────────────────────────────────────────────────────────────
envVarGroups:
  - name: aircargo-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true

# ─────────────────────────────────────────────────────────────────
# INFRAESTRUCTURA GESTIONADA POR RENDER — PostgreSQL (top-level)
# ─────────────────────────────────────────────────────────────────
databases:
  - name: aircargo-db
    databaseName: aircargo
    user: aircargo_user
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []   # sin acceso público; solo red interna de Render

services:
  # ─────────────────────────────────────────────────────────────────
  # Key Value (Redis-compatible) — opcional (rate-limit HA / caché)
  # Va en `services:` con `type: keyvalue`. NO admite `runtime`.
  # ─────────────────────────────────────────────────────────────────
  - type: keyvalue
    name: aircargo-cache
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []   # sin acceso público; solo red interna de Render

  # ─────────────────────────────────────────────────────────────────
  # MICROSERVICIOS (Web Services Docker) — contexto = raíz del repo
  # ─────────────────────────────────────────────────────────────────

  # 1. Auth Service (emite/valida JWT y refresh tokens)
  - type: web
    name: aircargo-auth
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: backend/aircargo-auth-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - fromGroup: aircargo-secrets
      - key: POSTGRES_USER
        fromDatabase:
          name: aircargo-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: aircargo-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: aircargo-db
          property: database
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        sync: false
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: https://aircargo-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://aircargo-frontend.onrender.com
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75"
    dependsOn:
      - aircargo-db

