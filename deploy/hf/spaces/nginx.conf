user  appuser;
worker_processes  4;

# Hugging Face Docker Spaces require listening on 7860
events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 25m;

    server {
        listen 7860 default_server;

        # Static SPA bundle (built in a prior stage)
        location / {
            root  /var/frontend;
            index index.html;

            # Client-side routing: last-resort fallback
            try_files $uri /index.html;
        }

        # Spring Cloud Gateway on the same box
        location /api/ {
            proxy_pass         http://127.0.0.1:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long-lived HTTP for SSE/scans; 25 min before timing out
            proxy_read_timeout 1500s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }
    }
}
