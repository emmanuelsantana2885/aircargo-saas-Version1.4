# ─── Aircargo — EC2 system nginx (native deployment, no containers) ───
# Production: system nginx on :80 + :443 serving ~/aircargo-saas/frontend/dist,
# proxying /api/ → Spring Cloud Gateway on localhost:8080.
#
# Install:
#   1. sudo cp deploy/ec2/nginx-aircargo.conf /etc/nginx/sites-available/aircargo
#      sudo ln -sf /etc/nginx/sites-available/aircargo /etc/nginx/sites-enabled/aircargo
#   2. Get TLS certs (TLS is served when the cert files exist; without them the
#      server still runs on :80 so the whole site keeps working):
#        sudo apt install -y certbot python3-certbot-nginx
#        sudo certbot --nginx -d <DOMAIN>            # edits this file, reloads nginx
#      Renewal (timer auto-installed by certbot):
#        sudo systemctl list-timers | grep certbot   # daily, renews before expiry
#   3. Optional hardening (see "Security hardening" below).
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# Placeholders with <> must be filled / removed before use. The file is
# reload-safe: nginx -t is always run first.

server {
    listen 80 default_server;
    server_name _;

    # Redirect to HTTPS when a cert exists. This block is edited by certbot:
    # after `certbot --nginx` it becomes a real 443 server + 80->443 redirect.
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

