spring.application.name=aircargo-notification-service
server.port=9100

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aircargo}?currentSchema=notification,auth,public&sslmode=disable
spring.datasource.username=${POSTGRES_USER:aircargo_user}
spring.datasource.password=${POSTGRES_PASSWORD:?}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=aircargo-notification-pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_notification
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:aircargo}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:?}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# mandatory=true: mensajes no enrutables se devuelven y quedan logueados (visibilidad)
spring.rabbitmq.template.mandatory=true
# reconexión automática del listener ante caídas del broker
spring.rabbitmq.listener.simple.retry.enabled=false

# Set RABBITMQ_ENABLED=false when RabbitMQ is unavailable (e.g., Arch Linux, no Docker)
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_ENABLED:true}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

auth-service.url=${AUTH_SERVICE_URL:http://localhost:9092}
# Feign timeout
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=10000
# Circuit breaker (resilience4j via Spring Cloud Circuit Breaker)
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=aircargo-notification
management.health.mail.enabled=false
management.health.rabbit.enabled=${RABBITMQ_ENABLED:true}
management.endpoint.health.show-details=always

app.jwt.secret=${JWT_SECRET:?}
# TTL de tokens emitidos EN-PROCESO (solo el token de servicio Feign, ver
# FeignServiceAuthInterceptor). El access token de usuario lo define auth-service.
app.jwt.expiration-ms=86400000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Retencion de auditoria (Politica de Privacidad)
app.audit.retention-months=24

# ── Logging con rotación (Mayor D) ──────────────────────────────
logging.file.name=${LOG_DIR:${user.home}}/aircargo-logs/notification-service.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR:${user.home}}/aircargo-logs/notification-service.%d.yyyy-MM-dd.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# Cliente Redis heredado de common — lazy: el servicio funciona sin Redis.
# No incluirlo en health para que /actuator/health no baje cuando no hay Redis (modo default).
management.health.redis.enabled=false
