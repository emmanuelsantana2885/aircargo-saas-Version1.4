spring.application.name=aircargo-auth-service
server.port=9092

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aircargo}?currentSchema=auth,flight,public&sslmode=disable
spring.datasource.username=${POSTGRES_USER:aircargo_user}
spring.datasource.password=${POSTGRES_PASSWORD:?}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=aircargo-auth-pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000

# Esquema gestionado por Flyway (migraciones explicitas). validate = falla el arranque si hay drift
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=auth

spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.table=flyway_schema_history_auth
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Caching
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=aircargo-auth

app.jwt.secret=${JWT_SECRET:?}
# TTL del access token (JWT) de USUARIO emitido por auth-service. 15 min default
# (stateless; el refresh vía httpOnly cookie lo renueva). Env override para
# entornos que quieran ventanas más largas/cortas.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# MFA obligatorio para TODOS los usuarios (forzado en login: sin MFA no hay sesión).
# Politica de negocio = SIEMPRE true en produccion; los tests la sobreescriben a false.
# Solo desactivar explicitamente con APP_MFA_MANDATORY=false si se acepta operar sin MFA.
app.mfa.mandatory=${APP_MFA_MANDATORY:true}

# Política de re-enrolamiento MFA:
# · reset-on-startup=true (default): cada arranque del auth-service invalida los MFA
#   configurados antes del boot → el usuario debe re-configurar MFA (429/428 reset).
#   Deshabilitar para conservar enrolamientos entre reinicios.
# · max-age-days (default 7): aunque no haya reinicios, un MFA de más de N días caduca.
app.mfa.reset-on-startup=${MFA_RESET_ON_STARTUP:true}
app.mfa.max-age-days=${MFA_MAX_AGE_DAYS:7}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Cifrado en reposo de datos sensibles (mfaSecret, cedulas, firmas)
app.crypto.key=${APP_ENCRYPTION_KEY:}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Retencion de auditoria (Politica de Privacidad)
app.audit.retention-months=24

# ── Logging con rotación (Mayor D) ──────────────────────────────
logging.file.name=${LOG_DIR:${user.home}}/aircargo-logs/auth-service.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR:${user.home}}/aircargo-logs/auth-service.%d.yyyy-MM-dd.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# Cliente Redis heredado de common — lazy: el servicio funciona sin Redis.
# No incluirlo en health para que /actuator/health no baje cuando no hay Redis (modo default).
management.health.redis.enabled=false

# Redis para user-state (heartbeat/snapshot) — opcional, fail-open
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# ── RabbitMQ: consumidor de auditoría (Fase 3 — re-habilitado) ──────────────
# auth consume `audit.log` y persiste en auth.audit_log los eventos que publican
# los demás servicios (common AuditService, routing key audit.log). Broker docker
# aircargo-rabbitmq (RABBITMQ_PORT). Deshabilitable con RABBITMQ_ENABLED=false
# (los start scripts ya lo pasan según la disponibilidad del broker).
app.rabbitmq.enabled=${RABBITMQ_ENABLED:true}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:aircargo}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:?}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
