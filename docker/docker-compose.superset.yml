# ────────────────────────────────────────────────────────────────
# Apache Superset — BI self-hosted (OPCIONAL) para Aircargo
#
#   Uso:
#     1. Agregar a .env:
#          SUPERSET_SECRET_KEY=   (openssl rand -base64 42)
#          SUPERSET_ADMIN_PASSWORD=...
#     2. ./scripts/configure-bi-reader.sh   (crea el rol de solo lectura)
#     3. docker compose -f docker/docker-compose.superset.yml up -d
#     4. Abrir http://localhost:8088 (admin / SUPERSET_ADMIN_PASSWORD)
#     5. Settings → Database Connections → + Database → PostgreSQL y usar:
#          Host: host.docker.internal   (el Postgres de Aircargo corre en el host)
#          Port: 5432  Database: aircargo
#          Username: bi_reader  Password: BI_READER_PASSWORD
#        (o pegar la URI)
#          postgresql+psycopg2://bi_reader:PASS@host.docker.internal:5432/aircargo
#
#   NOTAS:
#   - El volumen `superset_home` guarda la METADATA propia de Superset
#     (catálogos, dashboards, conexiones). NO se mezcla con la BD de Aircargo.
#   - host.docker.internal permite al contenedor llegar al Postgres del host
#     (EC2 nativo / docker-compose.infrastructure). Si el Postgres corre en el
#     mismo compose externo, reemplazar por el nombre del servicio y su network.
#   - Superset solo LEE: la conexión usa bi_reader (SELECT-only).
# ────────────────────────────────────────────────────────────────
services:
  superset:
    image: ${SUPERSET_IMAGE:-apache/superset:3.1.1}
    container_name: aircargo-superset
    restart: unless-stopped
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Define SUPERSET_SECRET_KEY en .env (openssl rand -base64 42)}
      # Metadata propia (SQLite dentro del volumen). Para un metadata externo
      # definir SUPERSET_METADATA_URI (p.ej. otro Postgres dedicado).
      SUPERSET_METADATA_URI: ${SUPERSET_METADATA_URI:-sqlite:////app/superset_home/superset.db}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@aircargo.com}
      PYTHONPATH: /app/pythonpath
    volumes:
      - superset_home:/app/superset_home
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        superset db upgrade
        superset fab create-admin \
          --username "$${SUPERSET_ADMIN_USER}" \
          --firstname Aircargo --lastname BI \
          --email "$${SUPERSET_ADMIN_EMAIL}" \
          --password "$${SUPERSET_ADMIN_PASSWORD}" || true
        superset init
        exec gunicorn -b 0.0.0.0:8088 \
          --workers 2 --threads 4 --timeout 120 \
          "superset.app:create_app()"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8088/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  superset_home:
    name: aircargo-superset-home